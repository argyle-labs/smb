<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
    <pattern id="argyle" width="120" height="160" patternUnits="userSpaceOnUse">
      <rect width="120" height="160" fill="#170F08"/>
      <polygon points="60,0 120,80 60,160 0,80" fill="#4A3422"/>
      <polygon points="0,0 60,80 0,160" fill="#2F2116"/>
      <polygon points="120,0 60,80 120,160" fill="#2F2116"/>
      <g stroke="#C89A7C" stroke-width="2" opacity="0.30" stroke-dasharray="6 7">
        <path d="M60 -80 L200 80 M60 -80 L-80 80 M60 80 L200 240 M60 80 L-80 240 M60 240 L200 400 M60 240 L-80 400"/>
      </g>
    </pattern>
  </defs>
  <g clip-path="url(#tile)"><rect x="16" y="16" width="480" height="480" fill="url(#argyle)"/></g>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#C89A7C" stroke-width="6"/>

  <!-- mapped network share: a monitor displaying a shared folder -->
  <g stroke="#170F08" stroke-width="7" stroke-linejoin="round">
    <rect x="138" y="150" width="236" height="154" rx="18" fill="#C89A7C"/>
    <rect x="160" y="172" width="192" height="110" rx="8" fill="#241609" stroke="none"/>
    <rect x="242" y="304" width="28" height="22" fill="#C89A7C"/>
    <rect x="190" y="324" width="132" height="16" rx="8" fill="#C89A7C"/>
  </g>
  <!-- shared folder on the display, with broadcast arcs (shared over network) -->
  <g stroke="#170F08" stroke-width="5" stroke-linejoin="round">
    <path d="M188 210 Q188 202 196 202 L230 202 Q235 202 238 206 L245 214 L286 214
             Q294 214 294 222 L294 258 Q294 266 286 266 L196 266 Q188 266 188 258 Z"
          fill="#E7C9AE"/>
  </g>
  <g fill="none" stroke="#E7C9AE" stroke-width="6" stroke-linecap="round">
    <path d="M304 236 a18 18 0 0 1 18 18"/>
    <path d="M304 220 a34 34 0 0 1 34 34"/>
  </g>
</svg>
