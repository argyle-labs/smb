[package]
name = "smb"
version = "0.1.0"
edition = "2021"
description = "SMB/CIFS StorageBackend for orca's storage domain — backend-only plugin"

[package.metadata.orca]
category = "storage"

[lib]
name = "smb"
path = "src/lib.rs"
# `cdylib` is the orca plugin artifact orca's `plugin-loader` `dlopen`s;
# `rlib` retains the in-crate `#[cfg(test)]` harness + lets a consumer use it
# as a normal Rust lib.
crate-type = ["rlib"]

[[bin]]
name = "smb"
path = "src/main.rs"

# smb is a BACKEND-ONLY orca plugin: it carries zero `#[orca_tool]`s and instead
# registers a `storage` StorageBackend across the cdylib FFI seam. Per
# [[feedback-plugin-toolkit-only-no-exceptions]] it reaches the whole orca
# system — infra AND the `storage` domain (`plugin_toolkit::storage`) — through
# `plugin-toolkit` alone.
#
# TODO(phase3-dep-flip): temporarily a direct local path dependency because the
# typed mount contract this plugin now implements
# (StorageBackend::validate_spec / render_options / mount_style, MountSpec /
# NormalizedSpec / OptionSet::Smb / SmbCredentials / SecretRef /
# register_from_def_styled) lives on orca branch
# `feat/storage-mount-contract-phase1` (PR #121) and is NOT yet on `main` (and is
# not currently pushed as a resolvable remote git ref). The prior
# `git = "…/orca", branch = "main"` + `[patch]`-to-local mechanism cannot be used
# here: local orca is plugin-toolkit 0.1.1-rc.21 while `main` still resolves
# 0.1.1-rc.9, and cargo refuses a cross-prerelease `[patch]`, so the patch is
# silently dropped and the phase1 symbols never resolve. Pointing directly at the
# local phase1 checkout is the only mechanism that compiles until #121 merges.
# FLIP THIS BACK to `{ git = "https://github.com/argyle-labs/orca",
# branch = "main" }` (or a released tag) once PR #121 lands on main.
[dependencies]
plugin-toolkit = { path = "../orca/projects/plugin-toolkit" }

# The ONE genuine non-orca dep: `#[export_root_module]` expands to bare
# dlopens), so it can't route through the toolkit. Pinned to the orca workspace
# version (0.11) so the layout hash baked into the cdylib matches what orca's
# plugin-loader checks at load time.

[dev-dependencies]
# Dev-only: the in-crate test harness probes mount health against a `tempfile`
# dir and drives the async smb tool wrappers under `#[tokio::test]`. `serde_json`
# is reached through `plugin_toolkit::serde_json`, so it needs no direct dep.
tempfile = "3"
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }

# Match orca's workspace lint floor: discarding a Result/Option via
# `let _ = ...` was a load-bearing past incident, so keep it a hard error here
# too — the plugin must stay portable back into the orca workspace.
[lints.clippy]
let_underscore_must_use = "deny"
