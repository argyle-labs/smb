[package]
name = "smb"
version = "0.1.0"
edition = "2021"
description = "SMB/CIFS StorageBackend for orca's storage domain — backend-only plugin"

[package.metadata.orca]
category = "storage"

[lib]
name = "smb"
path = "src/lib.rs"
# `rlib` retains the in-crate `#[cfg(test)]` harness + lets a consumer use it as
# a normal Rust lib. The runnable plugin is the `[[bin]]` below: smb runs as a
# subprocess over the orca socket.
crate-type = ["rlib"]

[[bin]]
name = "smb"
path = "src/main.rs"

# smb is a BACKEND-ONLY orca plugin: it carries zero `#[orca_tool]`s and instead
# registers a `storage` StorageBackend, served as a subprocess `[[bin]]` over the
# orca socket (`plugin_toolkit::serve_storage_plugin!`). Per
# [[feedback-plugin-toolkit-only-no-exceptions]] it reaches the whole orca
# system — infra AND the `storage` domain (`plugin_toolkit::storage`) — through
# `plugin-toolkit` alone; it has no other non-orca dependency.
#
# The typed mount contract it implements (StorageBackend::validate_spec /
# render_options / mount_style, MountSpec / NormalizedSpec / SecretRef /
# register_from_def_styled) is reached through `plugin-toolkit`. This backend
# owns its own SMB option + credential grammar and hands core only the opaque
# `OptionSet::Raw` string plus a generic `SecretFile`.
[dependencies]
# TEMP: tracks orca `main` (carries the genericized secret-file seam,
# SECRET_FILE_DIR/secret_file_path — orca#195, merged). Re-pin to the release tag
# that first carries #195 once it is cut.
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", tag = "v0.1.9-rc.19" }

[dev-dependencies]
# Dev-only: the in-crate test harness probes mount health against a `tempfile`
# dir and drives the async smb tool wrappers under `#[tokio::test]`. `serde_json`
# is reached through `plugin_toolkit::serde_json`, so it needs no direct dep.
tempfile = "3"
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }

# Match orca's workspace lint floor: discarding a Result/Option via
# `let _ = ...` was a load-bearing past incident, so keep it a hard error here
# too — the plugin must stay portable back into the orca workspace.
[lints.clippy]
let_underscore_must_use = "deny"
