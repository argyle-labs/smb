# Fetch git dependencies with the git CLI, matching CI's
# CARGO_NET_GIT_FETCH_WITH_CLI.
[net]
git-fetch-with-cli = true

# orca's crates declare sibling deps with `registry = "gitea"`; cargo skips
# their manifests from the git source unless the registry is defined here.
[registries.gitea]
index = "sparse+https://gitea.scottkey.me/api/packages/argyle-labs/cargo/"
